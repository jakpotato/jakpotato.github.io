<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Virtual Aquarium</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #0d1822;
        color: #fff;
    }

    #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    #topbar {
        flex: 0 0 auto;
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: #172734;
        border-bottom: 1px solid rgba(255,255,255,.12);
        z-index: 10;
    }

    .stats {
        display: flex;
        align-items: center;
        gap: 18px;
        flex: 1;
        min-width: 0;
    }

    .stat {
        white-space: nowrap;
        font-size: 14px;
        color: #c8d8e4;
    }

    .stat strong {
        display: block;
        color: #fff;
        font-size: 18px;
        margin-top: 2px;
    }

    button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        background: #267bb5;
        transition: transform .1s, opacity .1s;
    }

    button:active { transform: scale(.97); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .shop-button { background: #2f9e6f; }

    #tankWrap {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 8px;
        background: #0b151d;
    }

    #tank {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 14px;
        border: 3px solid rgba(255,255,255,.22);
        box-shadow: inset 0 0 40px rgba(0,0,0,.25), 0 5px 25px rgba(0,0,0,.3);
        background: linear-gradient(#3fb9d9 0%, #1592bb 55%, #08769b 100%);
    }

    #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .water-shine {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(105deg, rgba(255,255,255,.10), transparent 20%, transparent 72%, rgba(255,255,255,.05)),
            radial-gradient(circle at 18% 10%, rgba(255,255,255,.15), transparent 22%);
    }

    #shopView {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        background: #101b24;
        z-index: 20;
    }

    #shopHeader {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: #172734;
        border-bottom: 1px solid rgba(255,255,255,.12);
    }

    #shopHeader h2 {
        margin: 0;
        font-size: 20px;
    }

    #shopMoney {
        font-weight: 700;
        color: #bce8ff;
    }

    #shopContent {
        overflow-y: auto;
        padding: 14px;
        -webkit-overflow-scrolling: touch;
    }

    .section-title {
        margin: 4px 0 10px;
        font-size: 16px;
        color: #c7d8e4;
    }

    .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
    }

    .shop-card {
        background: #1b2c38;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 12px;
        padding: 10px;
    }

    .fish-preview {
        height: 85px;
        border-radius: 9px;
        background: linear-gradient(#287f99, #17677f);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 9px;
        overflow: hidden;
    }

    .fish-sprite-img {
        max-width: 110px;
        max-height: 85px;
        width: auto;
        height: auto;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
    }

    .shop-card h3 {
        margin: 0 0 4px;
        font-size: 15px;
    }

    .shop-card p {
        margin: 0 0 8px;
        color: #b6c7d2;
        font-size: 12px;
        min-height: 30px;
    }

    .variant {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 6px;
        padding: 7px;
        border-radius: 8px;
        background: rgba(0,0,0,.14);
    }

    .color-dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,.45);
        flex: 0 0 auto;
    }

    .variant-info {
        flex: 1;
        min-width: 0;
        font-size: 12px;
    }

    .variant-info strong {
        display: block;
        font-size: 13px;
        color: #fff;
    }

    .variant button {
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 7px;
    }

    .background-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        background: #1b2c38;
        border-radius: 12px;
        margin-bottom: 8px;
    }

    .background-preview {
        width: 72px;
        height: 52px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,.2);
        flex: 0 0 auto;
    }

    .background-info {
        flex: 1;
    }

    .background-info strong {
        display: block;
        margin-bottom: 3px;
    }

    .background-info span {
        color: #afc0ca;
        font-size: 12px;
    }

    .danger {
        width: 100%;
        margin: 18px 0 8px;
        background: #9c3b42;
    }

    #toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 20px);
        background: rgba(0,0,0,.82);
        color: #fff;
        padding: 10px 16px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
        z-index: 100;
        font-size: 14px;
        text-align: center;
    }

    #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
        #topbar {
            min-height: 58px;
            padding: 8px 9px;
            gap: 7px;
        }
        .stats { gap: 9px; }
        .stat { font-size: 10px; }
        .stat strong { font-size: 15px; }
        button { padding: 9px 11px; font-size: 13px; }
        .shop-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        #shopContent { padding: 10px; }
    }

    @media (max-width: 380px) {
        .stat:nth-child(2) { display: none; }
        .shop-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div id="app">
    <div id="topbar">
        <div class="stats">
            <div class="stat">Money<strong id="money">$15.00</strong></div>
            <div class="stat">Fish<strong id="fishCount">0</strong></div>
            <div class="stat">Income/sec<strong id="income">$0.00</strong></div>
        </div>
        <button class="shop-button" id="shopButton">Shop</button>
    </div>

    <div id="tankWrap">
        <div id="tank">
            <canvas id="canvas"></canvas>
            <div class="water-shine"></div>
        </div>

        <div id="shopView">
            <div id="shopHeader">
                <h2>Shop</h2>
                <div id="shopMoney">$15.00</div>
                <button id="closeShop">Back</button>
            </div>
            <div id="shopContent">
                <div class="section-title">Fish</div>
                <div class="shop-grid" id="fishShop"></div>

                <div class="section-title" style="margin-top:20px;">Tank backgrounds</div>
                <div id="backgroundShop"></div>

                <button class="danger" id="resetButton">Reset Aquarium</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
(() => {
    "use strict";

    const SAVE_KEY = "virtualAquariumSave_v1";
    const INCOME_RATE = 0.005; // 0.5% of purchase price per second
    const STARTING_MONEY = 15;

    const fishTypes = [
        {
            id: "goldfish",
            name: "Goldfish",
            description: "A classic little aquarium fish.",
            size: 1.0,
            speed: 0.55,
            variants: [
                ["Brown", "#9b633f", 10],
                ["Red", "#d54a3f", 15],
                ["Pink", "#e98aa4", 20],
                ["White", "#e9e4d8", 25]
            ]
        },
        {
            id: "tetra",
            name: "Tetra",
            description: "Small, quick and easy to keep.",
            size: 0.72,
            speed: 0.85,
            variants: [
                ["Blue", "#4aa9d8", 12],
                ["Red", "#d94b4b", 18],
                ["Purple", "#9a65c9", 24],
                ["Gold", "#e5b84d", 30]
            ]
        },
        {
            id: "clownfish",
            name: "Clownfish",
            description: "A striped fish with plenty of personality.",
            size: 1.05,
            speed: 0.50,
            variants: [
                ["Orange", "#ef7b32", 20],
                ["Red", "#d94b3e", 30],
                ["Yellow", "#e8bf3e", 40],
                ["Pink", "#e68191", 50]
            ]
        },
        {
            id: "angelfish",
            name: "Angelfish",
            description: "Tall fins make this one stand out.",
            size: 1.35,
            speed: 0.38,
            variants: [
                ["Silver", "#c6d0d5", 35],
                ["Gold", "#d9a93f", 50],
                ["Black", "#30343a", 65],
                ["Blue", "#5d9fc4", 80]
            ]
        },
        {
            id: "betta",
            name: "Betta",
            description: "A small fish with a dramatic tail.",
            size: 1.0,
            speed: 0.45,
            variants: [
                ["Blue", "#4b82d1", 45],
                ["Red", "#d54850", 60],
                ["Purple", "#925bc1", 75],
                ["Rainbow", "#cf6aa9", 95]
            ]
        },
        {
            id: "puffer",
            name: "Pufferfish",
            description: "Round, curious and slightly grumpy.",
            size: 1.18,
            speed: 0.32,
            variants: [
                ["Yellow", "#e5c34e", 55],
                ["Green", "#76ad58", 70],
                ["Orange", "#e57d3e", 85],
                ["Pink", "#d8899c", 105]
            ]
        },
        {
            id: "guppy",
            name: "Guppy",
            description: "Tiny fish with a colorful tail.",
            size: 0.70,
            speed: 0.90,
            variants: [
                ["Blue", "#4d9fd0", 25],
                ["Red", "#d85454", 35],
                ["Yellow", "#e0b63f", 45],
                ["Purple", "#9b65c5", 55]
            ]
        },
        {
            id: "lionfish",
            name: "Lionfish",
            description: "Large fins and a distinctive silhouette.",
            size: 1.30,
            speed: 0.28,
            variants: [
                ["Red", "#c6534b", 90],
                ["Brown", "#875c45", 110],
                ["White", "#d9d4ca", 135],
                ["Black", "#3d4146", 160]
            ]
        }
    ];

    const backgrounds = [
        {
            id: "basic",
            name: "Blue Water",
            price: 0,
            top: "#3fb9d9",
            bottom: "#08769b",
            sand: "#c6aa73",
            plant: "#277c4b"
        },
        {
            id: "deep",
            name: "Deep Ocean",
            price: 150,
            top: "#267da2",
            bottom: "#063d67",
            sand: "#8b8062",
            plant: "#245f54"
        },
        {
            id: "tropical",
            name: "Tropical Reef",
            price: 300,
            top: "#52c9c7",
            bottom: "#168a8a",
            sand: "#d7c28b",
            plant: "#287b52"
        },
        {
            id: "sunset",
            name: "Sunset Tank",
            price: 500,
            top: "#e58b79",
            bottom: "#6d597b",
            sand: "#b69b76",
            plant: "#456d55"
        }
    ];

    // Sprite images live in a folder next to this HTML file, named
    // "<fishTypeId>_<colorname>.png" (e.g. fish-sprites/goldfish_brown.png).
    // Sprites should be transparent PNGs with the fish facing RIGHT.
    // To add a new fish or color later: add it to fishTypes above and
    // drop a matching PNG in the folder — no other code changes needed.
    const SPRITE_FOLDER = "fish-sprites";
    const SPRITE_HEIGHT_FACTOR = 2.5; // sprite height relative to physics radius

    const spriteCache = new Map();

    function colorSlug(name) {
        return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
    }

    function spritePath(typeId, colorName) {
        return `${SPRITE_FOLDER}/${typeId}_${colorSlug(colorName)}.png`;
    }

    function getSprite(typeId, colorName) {
        const key = typeId + "_" + colorSlug(colorName);
        let entry = spriteCache.get(key);
        if (!entry) {
            const img = new Image();
            entry = { img, status: "loading" };
            img.onload = () => { entry.status = "loaded"; };
            img.onerror = () => { entry.status = "error"; };
            img.src = spritePath(typeId, colorName);
            spriteCache.set(key, entry);
        }
        return entry;
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const tank = document.getElementById("tank");

    const moneyEl = document.getElementById("money");
    const fishCountEl = document.getElementById("fishCount");
    const incomeEl = document.getElementById("income");
    const shopMoneyEl = document.getElementById("shopMoney");
    const shopView = document.getElementById("shopView");
    const fishShop = document.getElementById("fishShop");
    const backgroundShop = document.getElementById("backgroundShop");
    const toast = document.getElementById("toast");

    let save = loadSave();
    let fish = [];
    let bubbles = [];
    let stones = [];
    let lastTime = performance.now();
    let lastMoneyUpdate = lastTime;
    let toastTimer = null;

    function defaultSave() {
        return {
            money: STARTING_MONEY,
            fish: [],
            background: "basic",
            ownedBackgrounds: ["basic"]
        };
    }

    function loadSave() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return defaultSave();
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object") return defaultSave();
            return {
                money: Number.isFinite(parsed.money) ? parsed.money : STARTING_MONEY,
                fish: Array.isArray(parsed.fish) ? parsed.fish : [],
                background: parsed.background || "basic",
                ownedBackgrounds: Array.isArray(parsed.ownedBackgrounds)
                    ? parsed.ownedBackgrounds
                    : ["basic"]
            };
        } catch {
            return defaultSave();
        }
    }

    function saveGame() {
        localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    }

    function moneyFormat(value) {
        return "$" + Math.max(0, value).toFixed(2);
    }

    function getFishDefinition(typeId) {
        return fishTypes.find(f => f.id === typeId);
    }

    function getVariant(typeId, variantIndex) {
        const type = getFishDefinition(typeId);
        return type ? type.variants[variantIndex] : null;
    }

    function incomePerSecond() {
        return save.fish.reduce((sum, item) => {
            const variant = getVariant(item.typeId, item.variantIndex);
            return sum + (variant ? variant[2] * INCOME_RATE : 0);
        }, 0);
    }

    function updateUI() {
        moneyEl.textContent = moneyFormat(save.money);
        shopMoneyEl.textContent = moneyFormat(save.money);
        fishCountEl.textContent = save.fish.length;
        incomeEl.textContent = moneyFormat(incomePerSecond());
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function resizeCanvas() {
        const rect = tank.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (fish.length) {
            fish.forEach(f => {
                f.x = Math.min(Math.max(f.x, f.radius), rect.width - f.radius);
                f.y = Math.min(Math.max(f.y, f.radius), rect.height - f.radius);
            });
        }
    }

    function tankSize() {
        return {
            width: tank.clientWidth,
            height: tank.clientHeight
        };
    }

    function createFish(item, index) {
        const def = getFishDefinition(item.typeId);
        const variant = getVariant(item.typeId, item.variantIndex);
        const { width, height } = tankSize();

        const baseRadius = 20 * def.size;
        const radius = baseRadius;

        return {
            id: item.id || (Date.now() + "-" + index + "-" + Math.random()),
            typeId: item.typeId,
            variantIndex: item.variantIndex,
            x: radius + Math.random() * Math.max(1, width - radius * 2),
            y: radius + Math.random() * Math.max(1, height - radius * 2),
            radius,
            speed: def.speed * 0.2 * (0.8 + Math.random() * 0.4),
            angle: Math.random() * Math.PI * 2,
            dir: Math.random() < .5 ? -1 : 1,
            turnTimer: 0.5 + Math.random() * 3,
            wiggle: Math.random() * Math.PI * 2,
            wiggleSpeed: 1 + Math.random() * 1.5,
            color: variant ? variant[1] : "#888"
        };
    }

    function rebuildFish() {
        fish = save.fish.map((item, i) => createFish(item, i));
    }

    function initEnvironment() {
        bubbles = Array.from({ length: 18 }, () => ({
            x: Math.random(),
            y: Math.random(),
            radius: 1.5 + Math.random() * 3,
            speed: .015 + Math.random() * .025,
            drift: Math.random() * Math.PI * 2
        }));

        stones = Array.from({ length: 25 }, () => ({
            x: Math.random(),
            size: 3 + Math.random() * 9,
            height: 2 + Math.random() * 5,
            offset: Math.random() * Math.PI * 2
        }));
    }

    function drawBackground(width, height) {
        const bg = backgrounds.find(b => b.id === save.background) || backgrounds[0];

        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, bg.top);
        gradient.addColorStop(1, bg.bottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Subtle light rays
        ctx.save();
        ctx.globalAlpha = .06;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.moveTo(width * .08, 0);
        ctx.lineTo(width * .28, 0);
        ctx.lineTo(width * .50, height);
        ctx.lineTo(width * .36, height);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(width * .68, 0);
        ctx.lineTo(width * .80, 0);
        ctx.lineTo(width * .66, height);
        ctx.lineTo(width * .54, height);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Plants
        ctx.save();
        ctx.strokeStyle = bg.plant;
        ctx.lineCap = "round";
        ctx.lineWidth = Math.max(2, width / 180);

        const plantCount = Math.max(5, Math.floor(width / 110));
        for (let i = 0; i < plantCount; i++) {
            const x = (i + .5) * width / plantCount;
            const h = 25 + ((i * 37) % 45);
            const baseY = height - 10;

            ctx.beginPath();
            ctx.moveTo(x, baseY);
            ctx.quadraticCurveTo(x - 10, baseY - h * .5, x - 3, baseY - h);
            ctx.stroke();

            if (i % 2 === 0) {
                ctx.beginPath();
                ctx.moveTo(x + 3, baseY);
                ctx.quadraticCurveTo(x + 14, baseY - h * .45, x + 8, baseY - h * .85);
                ctx.stroke();
            }
        }
        ctx.restore();

        // Bottom sand
        ctx.fillStyle = bg.sand;
        ctx.globalAlpha = .85;
        ctx.fillRect(0, height - 13, width, 13);
        ctx.globalAlpha = 1;

        // Stones
        stones.forEach(s => {
            const x = s.x * width;
            const y = height - 12 + Math.sin(s.offset) * 1.5;
            ctx.fillStyle = "rgba(65,65,65,.65)";
            ctx.beginPath();
            ctx.ellipse(x, y, s.size, s.height, 0, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawBubbles(width, height, dt) {
        bubbles.forEach(b => {
            b.y -= b.speed * dt / 1000;
            b.drift += .0015 * dt;

            if (b.y < -.05) {
                b.y = 1.02;
                b.x = Math.random();
            }

            const x = b.x * width + Math.sin(b.drift) * 4;
            const y = b.y * height;

            ctx.strokeStyle = "rgba(255,255,255,.42)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y, b.radius, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    function roundedRect(c, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
    }

    function drawFish(f) {
        const variant = getVariant(f.typeId, f.variantIndex);
        if (!variant) return;

        const entry = getSprite(f.typeId, variant[0]);
        if (entry.status !== "loaded") return; // still loading or failed — skip this frame

        const img = entry.img;
        const targetHeight = f.radius * SPRITE_HEIGHT_FACTOR;
        const targetWidth = targetHeight * (img.naturalWidth / img.naturalHeight);

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.scale(f.dir, 1);
        ctx.drawImage(img, -targetWidth / 2, -targetHeight / 2, targetWidth, targetHeight);
        ctx.restore();
    }

    function updateFish(f, dt) {
        const { width, height } = tankSize();

        f.turnTimer -= dt / 1000;
        if (f.turnTimer <= 0) {
            if (Math.random() < .7) {
                f.dir *= -1;
            }

            f.turnTimer = .8 + Math.random() * 3.2;
        }

        // Mostly horizontal movement with gentle vertical wandering.
        f.wiggle += f.wiggleSpeed * dt / 1000;
        f.angle += (Math.sin(f.wiggle) * .004) * dt;

        const horizontal = f.speed * f.dir;
        const vertical = Math.sin(f.wiggle * .7) * f.speed * .35;

        f.x += horizontal * dt;
        f.y += vertical * dt;

        const margin = f.radius + 2;

        if (f.x < margin) {
            f.x = margin;
            f.dir = 1;
            f.turnTimer = .6 + Math.random() * 1.5;
        } else if (f.x > width - margin) {
            f.x = width - margin;
            f.dir = -1;
            f.turnTimer = .6 + Math.random() * 1.5;
        }

        if (f.y < margin) {
            f.y = margin;
        } else if (f.y > height - margin - 10) {
            f.y = height - margin - 10;
        }
    }

    function animate(now) {
        const dt = Math.min(50, now - lastTime);
        lastTime = now;

        const { width, height } = tankSize();
        ctx.clearRect(0, 0, width, height);

        drawBackground(width, height);
        drawBubbles(width, height, dt);

        fish.forEach(f => updateFish(f, dt));

        // Random draw order gives a natural-looking foreground/background effect.
        fish.sort((a, b) => a.y - b.y);
        fish.forEach(drawFish);

        if (now - lastMoneyUpdate >= 100) {
            const elapsed = (now - lastMoneyUpdate) / 1000;
            save.money += incomePerSecond() * elapsed;
            lastMoneyUpdate = now;
            updateUI();
            saveGame();
        }

        requestAnimationFrame(animate);
    }

    function renderFishShop() {
        fishShop.innerHTML = "";

        fishTypes.forEach(type => {
            const card = document.createElement("div");
            card.className = "shop-card";

            const firstColorName = type.variants[0][0];
            card.innerHTML = `
                <div class="fish-preview">
                    <img class="fish-sprite-img" src="${spritePath(type.id, firstColorName)}"
                         alt="${type.name} (${firstColorName})"
                         onerror="this.style.display='none'">
                </div>
                <h3>${type.name}</h3>
                <p>${type.description}</p>
            `;

            type.variants.forEach((variant, index) => {
                const row = document.createElement("div");
                row.className = "variant";

                const owned = save.fish.some(f =>
                    f.typeId === type.id && f.variantIndex === index
                );

                row.innerHTML = `
                    <span class="color-dot" style="background:${variant[1]}"></span>
                    <div class="variant-info">
                        <strong>${variant[0]}</strong>
                        ${moneyFormat(variant[2])}
                    </div>
                    <button ${save.money < variant[2] ? "disabled" : ""}>
                        Buy
                    </button>
                `;

                row.querySelector("button").addEventListener("click", () => {
                    buyFish(type.id, index);
                });

                card.appendChild(row);
            });

            fishShop.appendChild(card);
        });
    }

    function renderBackgroundShop() {
        backgroundShop.innerHTML = "";

        backgrounds.forEach(bg => {
            const row = document.createElement("div");
            row.className = "background-card";

            const owned = save.ownedBackgrounds.includes(bg.id);
            const selected = save.background === bg.id;

            row.innerHTML = `
                <div class="background-preview" style="background:linear-gradient(${bg.top},${bg.bottom})"></div>
                <div class="background-info">
                    <strong>${bg.name}</strong>
                    <span>${bg.price === 0 ? "Free" : moneyFormat(bg.price)}</span>
                </div>
                <button ${selected ? "disabled" : ""}>
                    ${selected ? "Active" : owned ? "Use" : "Buy"}
                </button>
            `;

            row.querySelector("button").addEventListener("click", () => {
                buyOrUseBackground(bg);
            });

            backgroundShop.appendChild(row);
        });
    }

    function buyFish(typeId, variantIndex) {
        const variant = getVariant(typeId, variantIndex);
        if (!variant) return;

        const price = variant[2];
        if (save.money < price) {
            showToast("Not enough money.");
            return;
        }

        save.money -= price;
        save.fish.push({
            id: Date.now() + "-" + Math.random().toString(36).slice(2),
            typeId,
            variantIndex
        });

        fish.push(createFish(save.fish[save.fish.length - 1], fish.length));
        saveGame();
        updateUI();
        renderFishShop();
        renderBackgroundShop();
        showToast("Fish added to the aquarium.");
    }

    function buyOrUseBackground(bg) {
        if (save.ownedBackgrounds.includes(bg.id)) {
            save.background = bg.id;
            saveGame();
            renderBackgroundShop();
            showToast(bg.name + " selected.");
            return;
        }

        if (save.money < bg.price) {
            showToast("Not enough money.");
            return;
        }

        save.money -= bg.price;
        save.ownedBackgrounds.push(bg.id);
        save.background = bg.id;
        saveGame();
        updateUI();
        renderBackgroundShop();
        showToast(bg.name + " purchased.");
    }

    function openShop() {
        shopView.style.display = "flex";
        renderFishShop();
        renderBackgroundShop();
        updateUI();
    }

    function closeShop() {
        shopView.style.display = "none";
    }

    function resetProgress() {
        const confirmed = confirm(
            "Reset the aquarium and delete all saved progress? This cannot be undone."
        );
        if (!confirmed) return;

        save = defaultSave();
        saveGame();
        rebuildFish();
        updateUI();
        renderFishShop();
        renderBackgroundShop();
        showToast("Aquarium reset.");
    }

    document.getElementById("shopButton").addEventListener("click", openShop);
    document.getElementById("closeShop").addEventListener("click", closeShop);
    document.getElementById("resetButton").addEventListener("click", resetProgress);

    window.addEventListener("resize", resizeCanvas);

    initEnvironment();
    rebuildFish();
    resizeCanvas();
    updateUI();
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
