<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap The Button</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        overflow: hidden;
    }

    .screen {
        display: none;
        width: 100%;
        padding: 20px;
        position: relative;
    }

    .active {
        display: block;
    }

    h1 {
        margin-bottom: 30px;
    }

    button {
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: transform 0.1s;
    }

    button:active {
        transform: scale(0.95);
    }

    .menu-btn {
        background: #333;
        color: white;
        font-size: 1.4rem;
        padding: 20px 40px;
        margin: 15px;
        width: 250px;
    }

    #tapButton {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        margin: 20px auto;
        display: block;
        font-size: 2rem;
        color: white;
        user-select: none;
    }

    #scoreText {
        font-size: 2rem;
        margin-bottom: 10px;
    }

    #newBestBadge {
        display: none;
        color: gold;
        font-weight: bold;
        margin-bottom: 20px;
        font-size: 1.1rem;
        letter-spacing: 1px;
    }

    #resultsButtons {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    #resultsButtons.visible {
        opacity: 1;
        pointer-events: auto;
    }

    p {
        font-size: 1.2rem;
    }

    /* High score badge, always visible, top corner */
    #highScoreBadge {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 8px 14px;
        font-size: 0.85rem;
        line-height: 1.4;
        text-align: right;
        color: #ccc;
        backdrop-filter: blur(4px);
    }

    #highScoreBadge .label {
        color: #888;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    #highScoreBadge .value {
        color: gold;
        font-weight: bold;
        font-size: 1rem;
    }
</style>
</head>
<body>

<div id="highScoreBadge">
    <div class="label">Best</div>
    <div class="value" id="highScoreValue">–</div>
</div>

<!-- Menu -->
<div id="menu" class="screen active">
    <h1>Tap The Button</h1>
    <button class="menu-btn" onclick="startAccuracy()">Accuracy Mode</button>
    <br>
    <button class="menu-btn" onclick="startSpeed()">Speed Mode</button>
</div>

<!-- Game -->
<div id="game" class="screen">
    <h2 id="gameTitle"></h2>
    <p id="info"></p>
    <button id="tapButton"></button>
</div>

<!-- Results -->
<div id="results" class="screen">
    <h1>Round Complete</h1>
    <div id="scoreText"></div>
    <div id="newBestBadge">★ New Best! ★</div>

    <div id="resultsButtons">
        <button class="menu-btn" onclick="startAccuracy()">Accuracy Mode</button>
        <br>
        <button class="menu-btn" onclick="startSpeed()">Speed Mode</button>
    </div>
</div>

<script>
const menu = document.getElementById("menu");
const game = document.getElementById("game");
const results = document.getElementById("results");
const tapButton = document.getElementById("tapButton");
const gameTitle = document.getElementById("gameTitle");
const info = document.getElementById("info");
const scoreText = document.getElementById("scoreText");
const newBestBadge = document.getElementById("newBestBadge");
const highScoreValue = document.getElementById("highScoreValue");
const resultsButtons = document.getElementById("resultsButtons");

let mode = "";
let score = 0;
let gameOver = false;

// High scores, kept separately per mode
let highScores = { accuracy: 0, speed: 0 };

// ------------------------------------------------------------
// Persistence (falls back to in-memory only if storage is unavailable)
// ------------------------------------------------------------
async function loadHighScores() {
    try {
        const result = await window.storage.get("highscores");
        if (result && result.value) {
            const parsed = JSON.parse(result.value);
            highScores.accuracy = parsed.accuracy || 0;
            highScores.speed = parsed.speed || 0;
        }
    } catch (e) {
        // No saved scores yet, or storage unavailable — start at 0
    }
    updateHighScoreBadge();
}

async function saveHighScores() {
    try {
        await window.storage.set("highscores", JSON.stringify(highScores));
    } catch (e) {
        console.error("Could not save high scores:", e);
    }
}

function updateHighScoreBadge() {
    if (mode === "speed") {
        highScoreValue.textContent = highScores.speed;
    } else if (mode === "accuracy") {
        highScoreValue.textContent = highScores.accuracy;
    } else {
        const best = Math.max(highScores.accuracy, highScores.speed);
        highScoreValue.textContent = best > 0 ? best : "–";
    }
}

// ------------------------------------------------------------
// Screen handling
// ------------------------------------------------------------
function showScreen(screen) {
    document.querySelectorAll(".screen")
        .forEach(s => s.classList.remove("active"));

    screen.classList.add("active");
}

function endGame(finalScore) {
    gameOver = true;
    scoreText.textContent = `Score: ${finalScore}`;

    const isNewBest = finalScore > highScores[mode];
    if (isNewBest) {
        highScores[mode] = finalScore;
        saveHighScores();
    }
    newBestBadge.style.display = isNewBest ? "block" : "none";

    updateHighScoreBadge();

    // Show the score with no tappable buttons for a beat, so a tap
    // that just ended the round can't immediately restart a new one,
    // and so the player has a moment to actually read their score.
    resultsButtons.classList.remove("visible");
    showScreen(results);
    setTimeout(() => resultsButtons.classList.add("visible"), 1000);
}

// --------------------
// SPEED MODE
// --------------------
function startSpeed() {
    mode = "speed";
    score = 0;
    gameOver = false;
    updateHighScoreBadge();

    showScreen(game);
    gameTitle.textContent = "Speed Mode";
    info.textContent = "Tap as fast as you can for 15 seconds!";
    tapButton.style.background = "dodgerblue";
    tapButton.textContent = "TAP";

    tapButton.onclick = () => {
        if (gameOver) return;
        score++;
        tapButton.textContent = score;
    };

    setTimeout(() => {
        if (!gameOver) {
            endGame(score);
        }
    }, 15000);
}

// --------------------
// ACCURACY MODE
// --------------------
function startAccuracy() {
    mode = "accuracy";
    score = 0;
    gameOver = false;
    updateHighScoreBadge();

    showScreen(game);
    gameTitle.textContent = "Accuracy Mode";
    info.textContent =
        "Tap until the button turns red. If you tap red, your score becomes 0.";

    const colors = ["purple", "gold", "dodgerblue"];
    let colorIndex = 0;
    let tapsUntilChange = randomTapGoal();

    tapButton.style.background = colors[colorIndex];
    tapButton.textContent = "TAP";

    tapButton.onclick = () => {
        if (gameOver) return;

        // Lose if red is tapped
        if (tapButton.style.background === "red") {
            endGame(0);
            return;
        }

        score++;
        tapsUntilChange--;

        if (tapsUntilChange <= 0) {
            colorIndex = (colorIndex + 1) % colors.length;
            tapButton.style.background = colors[colorIndex];
            tapsUntilChange = randomTapGoal();
        }
    };

    setTimeout(() => {
        if (gameOver) return;

        // Turn red
        tapButton.style.background = "red";

        // Give player 1 second to accidentally tap
        setTimeout(() => {
            if (!gameOver) {
                endGame(score);
            }
        }, 1000);

    }, 15000);
}

function randomTapGoal() {
    return Math.floor(Math.random() * 8) + 5;
}

// Init
loadHighScores();
</script>

</body>
</html>
