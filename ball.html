<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ball Pile</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f4f4;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
}

#reset {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2;
    border: 0;
    border-radius: 10px;
    padding: 9px 14px;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    font: 14px system-ui, sans-serif;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    cursor: pointer;
    backdrop-filter: blur(6px);
}

#reset:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<button id="reset">Reset</button>

<script>
(() => {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const reset = document.getElementById("reset");

    let width;
    let height;
    let dpr = 1;
    let balls = [];
    let hue = 0;
    let lastTime = performance.now();

    const pointer = {
        x: 0,
        y: 0,
        previousX: 0,
        previousY: 0,
        vx: 0,
        vy: 0,
        down: false
    };

    const GRAVITY = 1200;
    const MAX_BALLS = 1000;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        for (const ball of balls) {
            ball.x = Math.max(ball.r, Math.min(width - ball.r, ball.x));
            ball.y = Math.max(ball.r, Math.min(height - ball.r, ball.y));
        }
    }

    function nextColor() {
        const color = `hsl(${hue} 78% 55%)`;
        hue = (hue + 21) % 360;
        return color;
    }

    function addBall(x, y) {
        if (balls.length >= MAX_BALLS) {
            balls.shift();
        }

        const r = 7 + Math.random() * 4;

        balls.push({
            x,
            y,
            vx: 0,
            vy: 0,
            r,
            color: nextColor(),
            mass: r * r
        });
    }

    function getPointerPosition(event) {
        const rect = canvas.getBoundingClientRect();

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }

    canvas.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse" && event.button !== 0) {
            return;
        }

        const p = getPointerPosition(event);

        pointer.x = p.x;
        pointer.y = p.y;
        pointer.previousX = p.x;
        pointer.previousY = p.y;
        pointer.vx = 0;
        pointer.vy = 0;
        pointer.down = true;

        try {
            canvas.setPointerCapture(event.pointerId);
        } catch (_) {}

        addBall(p.x, p.y);
    });

    canvas.addEventListener("pointermove", event => {
        const p = getPointerPosition(event);

        pointer.previousX = pointer.x;
        pointer.previousY = pointer.y;

        pointer.x = p.x;
        pointer.y = p.y;

        pointer.vx = pointer.x - pointer.previousX;
        pointer.vy = pointer.y - pointer.previousY;
    });

    canvas.addEventListener("pointerup", () => {
        pointer.down = false;
        pointer.vx = 0;
        pointer.vy = 0;
    });

    canvas.addEventListener("pointercancel", () => {
        pointer.down = false;
        pointer.vx = 0;
        pointer.vy = 0;
    });

    reset.addEventListener("click", () => {
        balls.length = 0;
        hue = 0;
    });

    /*
     * Keep every ball inside the screen.
     */
    function constrainToWalls(ball) {
        if (ball.x - ball.r < 0) {
            ball.x = ball.r;

            if (ball.vx < 0) {
                ball.vx = 0;
            }
        }

        if (ball.x + ball.r > width) {
            ball.x = width - ball.r;

            if (ball.vx > 0) {
                ball.vx = 0;
            }
        }

        if (ball.y - ball.r < 0) {
            ball.y = ball.r;

            if (ball.vy < 0) {
                ball.vy = 0;
            }
        }

        if (ball.y + ball.r > height) {
            ball.y = height - ball.r;

            if (ball.vy > 0) {
                ball.vy = 0;
            }

            // Ground friction.
            ball.vx *= 0.75;
        }
    }

    /*
     * Strong cursor/finger interaction.
     *
     * The pointer acts like a physical circular object pushing
     * nearby balls away from it. Pointer movement also transfers
     * momentum into the balls.
     */
    function applyPointerForce(ball) {
        if (!pointer.down) {
            return;
        }

        const dx = ball.x - pointer.x;
        const dy = ball.y - pointer.y;

        const distance = Math.hypot(dx, dy);

        const influence =
            ball.r +
            45;

        if (distance > influence) {
            return;
        }

        let nx;
        let ny;

        if (distance < 0.001) {
            nx = 0;
            ny = -1;
        } else {
            nx = dx / distance;
            ny = dy / distance;
        }

        const strength = 1 - distance / influence;

        /*
         * Strong radial push.
         */
        const force = strength * 180;

        ball.vx += nx * force;
        ball.vy += ny * force;

        /*
         * Transfer cursor/finger movement into the ball.
         */
        ball.vx += pointer.vx * strength * 4;
        ball.vy += pointer.vy * strength * 4;

        /*
         * Prevent a ball from being dragged through the pointer.
         */
        const minimumDistance = ball.r + 8;

        if (distance < minimumDistance) {
            ball.x = pointer.x + nx * minimumDistance;
            ball.y = pointer.y + ny * minimumDistance;
        }
    }

    /*
     * Very strict circle-vs-circle collision.
     *
     * Balls are never allowed to occupy the same physical space.
     */
    function solveCollision(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;

        const minimumDistance = a.r + b.r;
        const distanceSquared = dx * dx + dy * dy;

        if (distanceSquared >= minimumDistance * minimumDistance) {
            return;
        }

        let distance = Math.sqrt(distanceSquared);

        let nx;
        let ny;

        if (distance < 0.0001) {
            /*
             * Balls somehow ended up at exactly the same position.
             * Give them a deterministic separation direction.
             */
            nx = 0;
            ny = -1;
            distance = 0;
        } else {
            nx = dx / distance;
            ny = dy / distance;
        }

        /*
         * Move the balls apart until their edges exactly touch.
         *
         * This is the important part that prevents overlapping.
         */
        const overlap = minimumDistance - distance;

        const totalMass = a.mass + b.mass;

        const moveA = overlap * (b.mass / totalMass);
        const moveB = overlap * (a.mass / totalMass);

        a.x -= nx * moveA;
        a.y -= ny * moveA;

        b.x += nx * moveB;
        b.y += ny * moveB;

        /*
         * Calculate relative velocity along the collision normal.
         */
        const relativeVx = b.vx - a.vx;
        const relativeVy = b.vy - a.vy;

        const velocityAlongNormal =
            relativeVx * nx +
            relativeVy * ny;

        /*
         * They are already separating.
         */
        if (velocityAlongNormal > 0) {
            return;
        }

        /*
         * Very low bounce.
         *
         * This lets balls settle into a stable stack instead of
         * constantly bouncing.
         */
        const restitution = 0.05;

        const impulse =
            -(1 + restitution) *
            velocityAlongNormal /
            (1 / a.mass + 1 / b.mass);

        const ix = impulse * nx;
        const iy = impulse * ny;

        a.vx -= ix / a.mass;
        a.vy -= iy / a.mass;

        b.vx += ix / b.mass;
        b.vy += iy / b.mass;
    }

    /*
     * Additional positional collision pass.
     *
     * Several passes are used each frame so that a pile becomes
     * tightly packed instead of slowly sinking into itself.
     */
    function solveAllCollisions() {
        for (let pass = 0; pass < 5; pass++) {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    solveCollision(balls[i], balls[j]);
                }
            }

            for (const ball of balls) {
                constrainToWalls(ball);
            }
        }
    }

    function update(dt) {
        dt = Math.min(dt, 0.016);

        /*
         * Gravity.
         *
         * There is no horizontal gravity. A stationary ball only
         * accelerates downward.
         */
        for (const ball of balls) {
            ball.vy += GRAVITY * dt;

            applyPointerForce(ball);

            /*
             * Air resistance.
             */
            ball.vx *= 0.995;
            ball.vy *= 0.995;

            /*
             * Move.
             */
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            constrainToWalls(ball);
        }

        /*
         * Multiple collision passes make the stack rigid.
         */
        solveAllCollisions();

        /*
         * Once a ball is sitting on another ball, remove tiny
         * vertical jitter so the pile settles.
         */
        for (const ball of balls) {
            if (Math.abs(ball.vy) < 12) {
                ball.vy = 0;
            }

            if (Math.abs(ball.vx) < 3) {
                ball.vx = 0;
            }
        }

        /*
         * One final collision pass after velocity cleanup.
         */
        solveAllCollisions();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        /*
         * Ground shadow.
         */
        if (balls.length) {
            ctx.save();

            ctx.globalAlpha = 0.08;
            ctx.fillStyle = "#000";

            ctx.beginPath();

            ctx.ellipse(
                width / 2,
                height + 5,
                Math.min(width * 0.48, 600),
                18,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();
        }

        for (const ball of balls) {
            /*
             * Small drop shadow.
             */
            ctx.beginPath();

            ctx.arc(
                ball.x + 1,
                ball.y + 2,
                ball.r,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "rgba(0,0,0,.14)";
            ctx.fill();

            /*
             * Ball highlight.
             */
            const gradient = ctx.createRadialGradient(
                ball.x - ball.r * 0.35,
                ball.y - ball.r * 0.4,
                ball.r * 0.05,

                ball.x,
                ball.y,
                ball.r
            );

            gradient.addColorStop(
                0,
                "rgba(255,255,255,.75)"
            );

            gradient.addColorStop(
                0.2,
                ball.color
            );

            gradient.addColorStop(
                1,
                ball.color
            );

            ctx.beginPath();

            ctx.arc(
                ball.x,
                ball.y,
                ball.r,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = gradient;
            ctx.fill();
        }
    }

    function animate(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        update(dt);
        draw();

        requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
})();
</script>

</body>
</html>
