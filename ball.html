<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ball Pile</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f4f4;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
}

#reset {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2;
    border: 0;
    border-radius: 10px;
    padding: 9px 14px;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    font: 14px system-ui, sans-serif;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    cursor: pointer;
    backdrop-filter: blur(6px);
}

#reset:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<button id="reset">Reset</button>

<script>
(() => {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const reset = document.getElementById("reset");

    // ------------------------------------------------------------
    // Settings
    // ------------------------------------------------------------

    const GRAVITY = 120;

    // Small bounce between balls. Keeps the satisfying physics.
    const BALL_BOUNCE = 0.18;

    // Slightly stronger bounce from the walls/floor.
    const WALL_BOUNCE = 0.28;

    // Balls become eligible for sleeping after this long
    // without meaningful movement.
    const SLEEP_DELAY = 0.30;

    // A ball moving slower than this can eventually sleep.
    const SLEEP_SPEED = 12;

    // Spatial grid cell size.
    const GRID_SIZE = 24;

    // Physics always runs at this fixed rate.
    const FIXED_STEP = 1 / 60;

    // Prevents a huge backlog after a tab is inactive.
    const MAX_ACCUMULATED_TIME = 0.1;

    // ------------------------------------------------------------
    // State
    // ------------------------------------------------------------

    let width = 0;
    let height = 0;
    let dpr = 1;

    let balls = [];
    let hue = 0;

    let accumulator = 0;
    let lastTime = performance.now();

    const pointer = {
        x: 0,
        y: 0,
        previousX: 0,
        previousY: 0,
        vx: 0,
        vy: 0,
        down: false
    };

    // ------------------------------------------------------------
    // Resize
    // ------------------------------------------------------------

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        for (const ball of balls) {
            ball.x = Math.max(
                ball.r,
                Math.min(width - ball.r, ball.x)
            );

            ball.y = Math.max(
                ball.r,
                Math.min(height - ball.r, ball.y)
            );
        }
    }

    // ------------------------------------------------------------
    // Balls
    // ------------------------------------------------------------

    function nextColor() {
        const color = `hsl(${hue} 78% 55%)`;

        hue = (hue + 21) % 360;

        return color;
    }

    function addBall(x, y) {
        const radius = 6 + Math.random() * 3.5;

        balls.push({
            x,
            y,

            vx: 0,
            vy: 0,

            r: radius,
            mass: radius * radius,

            color: nextColor(),

            // Sleeping state.
            sleeping: false,

            // Time spent below the sleeping speed.
            sleepTimer: 0,

            // Used to determine whether the ball is supported.
            supported: false
        });
    }

    // ------------------------------------------------------------
    // Pointer
    // ------------------------------------------------------------

    function getPointerPosition(event) {
        const rect = canvas.getBoundingClientRect();

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }

    canvas.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse" && event.button !== 0) {
            return;
        }

        const p = getPointerPosition(event);

        pointer.x = p.x;
        pointer.y = p.y;

        pointer.previousX = p.x;
        pointer.previousY = p.y;

        pointer.vx = 0;
        pointer.vy = 0;

        pointer.down = true;

        try {
            canvas.setPointerCapture(event.pointerId);
        } catch (_) {}

        addBall(p.x, p.y);

        // Wake balls near the new ball immediately.
        wakeNearby(p.x, p.y, 55);
    });

    canvas.addEventListener("pointermove", event => {
        const p = getPointerPosition(event);

        pointer.previousX = pointer.x;
        pointer.previousY = pointer.y;

        pointer.x = p.x;
        pointer.y = p.y;

        pointer.vx = pointer.x - pointer.previousX;
        pointer.vy = pointer.y - pointer.previousY;

        if (pointer.down) {
            wakeNearby(pointer.x, pointer.y, 65);
        }
    });

    canvas.addEventListener("pointerup", () => {
        pointer.down = false;
        pointer.vx = 0;
        pointer.vy = 0;
    });

    canvas.addEventListener("pointercancel", () => {
        pointer.down = false;
        pointer.vx = 0;
        pointer.vy = 0;
    });

    // ------------------------------------------------------------
    // Reset
    // ------------------------------------------------------------

    reset.addEventListener("click", () => {
        balls.length = 0;
        hue = 0;
    });

    // ------------------------------------------------------------
    // Spatial grid
    // ------------------------------------------------------------

    const grid = new Map();

    function gridKey(x, y) {
        return x + "," + y;
    }

    function rebuildGrid() {
        grid.clear();

        for (let i = 0; i < balls.length; i++) {
            const ball = balls[i];

            const gx = Math.floor(ball.x / GRID_SIZE);
            const gy = Math.floor(ball.y / GRID_SIZE);

            const key = gridKey(gx, gy);

            let cell = grid.get(key);

            if (!cell) {
                cell = [];
                grid.set(key, cell);
            }

            cell.push(i);
        }
    }

    function getNearbyBalls(x, y, radius, callback) {
        const minX = Math.floor((x - radius) / GRID_SIZE);
        const maxX = Math.floor((x + radius) / GRID_SIZE);

        const minY = Math.floor((y - radius) / GRID_SIZE);
        const maxY = Math.floor((y + radius) / GRID_SIZE);

        for (let gx = minX; gx <= maxX; gx++) {
            for (let gy = minY; gy <= maxY; gy++) {
                const cell = grid.get(gridKey(gx, gy));

                if (!cell) {
                    continue;
                }

                for (const index of cell) {
                    callback(index);
                }
            }
        }
    }

    // ------------------------------------------------------------
    // Sleeping
    // ------------------------------------------------------------

    function wakeBall(ball) {
        if (!ball.sleeping) {
            return;
        }

        ball.sleeping = false;
        ball.sleepTimer = 0;
    }

    function wakeNearby(x, y, radius) {
        getNearbyBalls(x, y, radius, index => {
            wakeBall(balls[index]);
        });
    }

    function wakeConnectedBalls(startIndex) {
        const queue = [startIndex];
        const visited = new Set([startIndex]);

        while (queue.length) {
            const index = queue.shift();
            const ball = balls[index];

            wakeBall(ball);

            const radius = ball.r + 12;

            getNearbyBalls(ball.x, ball.y, radius, otherIndex => {
                if (visited.has(otherIndex)) {
                    return;
                }

                const other = balls[otherIndex];

                const dx = other.x - ball.x;
                const dy = other.y - ball.y;

                const distance = Math.hypot(dx, dy);

                if (distance <= ball.r + other.r + 8) {
                    visited.add(otherIndex);
                    queue.push(otherIndex);
                }
            });
        }
    }

    function updateSleeping(ball, dt) {
        if (ball.sleeping) {
            return;
        }

        const speed = Math.hypot(ball.vx, ball.vy);

        if (ball.supported && speed < SLEEP_SPEED) {
            ball.sleepTimer += dt;

            if (ball.sleepTimer >= SLEEP_DELAY) {
                ball.vx = 0;
                ball.vy = 0;
                ball.sleeping = true;
                ball.sleepTimer = 0;
            }
        } else {
            ball.sleepTimer = 0;
        }
    }

    // ------------------------------------------------------------
    // Walls
    // ------------------------------------------------------------

    function constrainToWalls(ball) {
        let touchedFloor = false;

        if (ball.x - ball.r < 0) {
            ball.x = ball.r;

            if (ball.vx < 0) {
                ball.vx *= -WALL_BOUNCE;
            }
        }

        if (ball.x + ball.r > width) {
            ball.x = width - ball.r;

            if (ball.vx > 0) {
                ball.vx *= -WALL_BOUNCE;
            }
        }

        if (ball.y - ball.r < 0) {
            ball.y = ball.r;

            if (ball.vy < 0) {
                ball.vy *= -WALL_BOUNCE;
            }
        }

        if (ball.y + ball.r > height) {
            ball.y = height - ball.r;

            touchedFloor = true;

            if (ball.vy > 0) {
                ball.vy *= -WALL_BOUNCE;
            }

            // Floor friction.
            ball.vx *= 0.82;
        }

        return touchedFloor;
    }

    // ------------------------------------------------------------
    // Pointer physics
    // ------------------------------------------------------------

    function applyPointer(ball) {
        if (!pointer.down) {
            return false;
        }

        const dx = ball.x - pointer.x;
        const dy = ball.y - pointer.y;

        const distance = Math.hypot(dx, dy);

        const influenceRadius = 48 + ball.r;

        if (distance > influenceRadius) {
            return false;
        }

        let nx;
        let ny;

        if (distance < 0.001) {
            nx = 0;
            ny = -1;
        } else {
            nx = dx / distance;
            ny = dy / distance;
        }

        const strength =
            1 - distance / influenceRadius;

        /*
         * The pointer acts as a physical moving object.
         */
        const force = 220 * strength;

        ball.vx += nx * force;
        ball.vy += ny * force;

        /*
         * Transfer finger/mouse velocity.
         */
        ball.vx += pointer.vx * strength * 5;
        ball.vy += pointer.vy * strength * 5;

        /*
         * Don't allow the pointer to pass through a ball.
         */
        const minimumDistance = ball.r + 5;

        if (distance < minimumDistance) {
            ball.x = pointer.x + nx * minimumDistance;
            ball.y = pointer.y + ny * minimumDistance;
        }

        return true;
    }

    // ------------------------------------------------------------
    // Ball collision
    // ------------------------------------------------------------

    function solveCollision(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;

        const minimumDistance = a.r + b.r;
        const distanceSquared = dx * dx + dy * dy;

        if (
            distanceSquared >=
            minimumDistance * minimumDistance
        ) {
            return false;
        }

        let distance = Math.sqrt(distanceSquared);

        let nx;
        let ny;

        if (distance < 0.0001) {
            nx = 0;
            ny = -1;
            distance = 0;
        } else {
            nx = dx / distance;
            ny = dy / distance;
        }

        /*
         * Absolutely no overlap.
         */
        const overlap = minimumDistance - distance;

        const totalMass = a.mass + b.mass;

        const moveA =
            overlap * (b.mass / totalMass);

        const moveB =
            overlap * (a.mass / totalMass);

        a.x -= nx * moveA;
        a.y -= ny * moveA;

        b.x += nx * moveB;
        b.y += ny * moveB;

        /*
         * Determine which ball is moving into the other.
         */
        const relativeVx = b.vx - a.vx;
        const relativeVy = b.vy - a.vy;

        const velocityAlongNormal =
            relativeVx * nx +
            relativeVy * ny;

        /*
         * Mark balls as supported when the collision is mostly
         * vertical and the lower ball is beneath the upper one.
         */
        if (Math.abs(ny) > 0.55) {
            if (a.y < b.y) {
                a.supported = true;
            } else {
                b.supported = true;
            }
        }

        if (velocityAlongNormal >= 0) {
            return true;
        }

        /*
         * Preserve a little bounce.
         */
        const impulse =
            -(1 + BALL_BOUNCE) *
            velocityAlongNormal /
            (1 / a.mass + 1 / b.mass);

        const ix = impulse * nx;
        const iy = impulse * ny;

        a.vx -= ix / a.mass;
        a.vy -= iy / a.mass;

        b.vx += ix / b.mass;
        b.vy += iy / b.mass;

        /*
         * If a moving ball hits a sleeping ball, wake the connected
         * portion of the pile.
         */
        if (a.sleeping && !b.sleeping) {
            wakeConnectedBalls(balls.indexOf(a));
        }

        if (b.sleeping && !a.sleeping) {
            wakeConnectedBalls(balls.indexOf(b));
        }

        return true;
    }

    // ------------------------------------------------------------
    // Physics
    // ------------------------------------------------------------

    function physicsStep(dt) {
        /*
         * Reset support information.
         */
        for (const ball of balls) {
            ball.supported = false;
        }

        rebuildGrid();

        /*
         * Apply gravity and movement only to awake balls.
         *
         * Sleeping balls completely ignore gravity.
         */
        for (const ball of balls) {
            if (ball.sleeping) {
                continue;
            }

            ball.vy += GRAVITY * dt;

            const touchedPointer = applyPointer(ball);

            if (touchedPointer) {
                wakeBall(ball);
            }

            ball.vx *= 0.995;
            ball.vy *= 0.995;

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            const touchedFloor =
                constrainToWalls(ball);

            if (touchedFloor) {
                ball.supported = true;
            }
        }

        /*
         * Several inexpensive passes are much more stable than
         * one large collision correction.
         */
        for (let pass = 0; pass < 3; pass++) {
            rebuildGrid();

            for (let i = 0; i < balls.length; i++) {
                const a = balls[i];

                const gx = Math.floor(a.x / GRID_SIZE);
                const gy = Math.floor(a.y / GRID_SIZE);

                for (let ox = -1; ox <= 1; ox++) {
                    for (let oy = -1; oy <= 1; oy++) {

                        const cell =
                            grid.get(
                                gridKey(
                                    gx + ox,
                                    gy + oy
                                )
                            );

                        if (!cell) {
                            continue;
                        }

                        for (const j of cell) {
                            if (j <= i) {
                                continue;
                            }

                            solveCollision(
                                a,
                                balls[j]
                            );
                        }
                    }
                }
            }

            /*
             * Keep balls inside the screen after positional
             * collision correction.
             */
            for (const ball of balls) {
                constrainToWalls(ball);
            }
        }

        /*
         * Stop tiny amounts of jitter.
         */
        for (const ball of balls) {
            if (ball.sleeping) {
                continue;
            }

            if (Math.abs(ball.vx) < 2) {
                ball.vx = 0;
            }

            if (Math.abs(ball.vy) < 4) {
                ball.vy = 0;
            }

            updateSleeping(ball, dt);
        }
    }

    // ------------------------------------------------------------
    // Rendering
    // ------------------------------------------------------------

    function draw() {
        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        /*
         * Subtle ground shadow.
         */
        if (balls.length) {
            ctx.save();

            ctx.globalAlpha = 0.08;
            ctx.fillStyle = "#000";

            ctx.beginPath();

            ctx.ellipse(
                width / 2,
                height + 5,
                Math.min(width * 0.48, 600),
                18,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();
        }

        for (const ball of balls) {
            /*
             * Drop shadow.
             */
            ctx.beginPath();

            ctx.arc(
                ball.x + 1,
                ball.y + 2,
                ball.r,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "rgba(0,0,0,.13)";

            ctx.fill();

            /*
             * Highlight.
             */
            const gradient =
                ctx.createRadialGradient(
                    ball.x - ball.r * 0.35,
                    ball.y - ball.r * 0.4,
                    ball.r * 0.05,

                    ball.x,
                    ball.y,
                    ball.r
                );

            gradient.addColorStop(
                0,
                "rgba(255,255,255,.75)"
            );

            gradient.addColorStop(
                0.22,
                ball.color
            );

            gradient.addColorStop(
                1,
                ball.color
            );

            ctx.beginPath();

            ctx.arc(
                ball.x,
                ball.y,
                ball.r,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = gradient;
            ctx.fill();
        }
    }

    // ------------------------------------------------------------
    // Animation
    // ------------------------------------------------------------

    function animate(now) {
        let elapsed =
            (now - lastTime) / 1000;

        lastTime = now;

        elapsed = Math.min(
            elapsed,
            MAX_ACCUMULATED_TIME
        );

        accumulator += elapsed;

        while (accumulator >= FIXED_STEP) {
            physicsStep(FIXED_STEP);
            accumulator -= FIXED_STEP;
        }

        draw();

        requestAnimationFrame(animate);
    }

    // ------------------------------------------------------------
    // Ball counter
    // -----------------------------------------------

    const counter = document.createElement("div");

    counter.id = "ballCounter";

    counter.style.position = "fixed";
    counter.style.top = "16px";
    counter.style.left = "16px";
    counter.style.zIndex = "2";
    counter.style.padding = "9px 12px";
    counter.style.borderRadius = "10px";
    counter.style.background = "rgba(255,255,255,.92)";
    counter.style.color = "#333";
    counter.style.font = "14px system-ui,sans-serif";
    counter.style.boxShadow =
        "0 2px 12px rgba(0,0,0,.12)";
    counter.style.backdropFilter = "blur(6px)";

    document.body.appendChild(counter);

    function updateCounter() {
        counter.textContent =
            `Balls: ${balls.length}`;
    }

    /*
     * Updating this at 10 FPS is plenty and avoids doing DOM work
     * every animation frame.
     */
    setInterval(updateCounter, 100);

    // ------------------------------------------------------------
    // Start
    // ------------------------------------------------------------

    window.addEventListener(
        "resize",
        resize
    );

    resize();

    updateCounter();

    requestAnimationFrame(animate);
})();
</script>

</body>
</html>
