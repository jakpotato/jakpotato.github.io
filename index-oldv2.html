<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakPotato</title>
    <link rel="icon" type="image/x-icon" href="/potato.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const themeToggleBtn = document.getElementById("theme-toggle");
            const body = document.body;
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme === "dark") {
                body.classList.add("bg-dark", "text-light");
            }

            themeToggleBtn.addEventListener("click", function () {
                body.classList.toggle("bg-dark");
                body.classList.toggle("text-light");

                if (body.classList.contains("bg-dark")) {
                    localStorage.setItem("theme", "dark");
                } else {
                    localStorage.setItem("theme", "light");
                }
            });

            // List of fake sponsored pages
            const fakeAds = [
                "flies-r-us.html",
                "bog-bodies.html"
            ];

            // Randomly open one of the fake ads
            document.getElementById("sponsored-ad").addEventListener("click", function () {
                const randomAd = fakeAds[Math.floor(Math.random() * fakeAds.length)];
                window.location.href = randomAd;
            });
        });
    </script>

    <style>
        .page-button {
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 20px;
            font-size: 1.2rem;
        }

        .button-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Sponsored Ad */
        .sponsored-ad {
            max-width: 600px;
            margin: 40px auto 20px;
            padding: 20px;
            border: 2px dashed #999;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .sponsored-ad:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .sponsored-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .sponsored-ad h3 {
            margin-bottom: 8px;
        }

        .sponsored-ad p {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center">
            <h1>JakPotato</h1>

            <button id="theme-toggle" class="btn btn-outline-secondary">
                Toggle Dark/Light Mode
            </button>
        </div>

        <div class="button-container">

            <a href="word-game.html" class="btn btn-success page-button">
                ✏️ Word Game
            </a>

            <a href="ai.html" class="btn btn-primary page-button">
                🤖 A.I. - it's super advanced and cool
            </a>

            <a href="taps.html" class="btn btn-warning page-button">
                🔴 Simple tapping game
            </a>

            <a href="fish.html" class="btn btn-primary page-button">
                🐟 Fish
            </a>

            <a href="ball.html" class="btn btn-success page-button">
                🔴 Balls
            </a>

            <a href="weather-v2.html" class="btn btn-primary page-button">
                ☁️ Weather
            </a>
            
            <a href="clock.html" class="btn btn-warning page-button">
                🕙 Clock
            </a>

            <a href="price-compare.html" class="btn btn-success page-button">
                💲 Price Calculator
            </a>

            <a href="carb-counter.html" class="btn btn-warning page-button">
                🍝 Carb Counter
            </a>

            <a href="dino.html" class="btn btn-primary page-button">
                🦖 Dino Game
            </a>

        </div>

        <!-- Sponsored Section -->
        <div id="sponsored-ad" class="sponsored-ad">

            <div class="sponsored-label">
                Sponsored
            </div>

            <h3>✨ You Might Also Like...</h3>

            <p>
                Discover something completely legitimate™
            </p>

            <small>
                Click to learn more
            </small>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
