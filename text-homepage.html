<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakPotato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const themeToggleBtn = document.getElementById("theme-toggle");
            const body = document.body;
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme === "dark") {
                body.classList.add("bg-dark", "text-light");
            }

            themeToggleBtn.addEventListener("click", function () {
                body.classList.toggle("bg-dark");
                body.classList.toggle("text-light");

                if (body.classList.contains("bg-dark")) {
                    localStorage.setItem("theme", "dark");
                } else {
                    localStorage.setItem("theme", "light");
                }
            });
        });
    </script>

    <style>
        .page-button {
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 20px;
            font-size: 1.2rem;
        }

        .button-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1>JakPotato</h1>
            <button id="theme-toggle" class="btn btn-outline-secondary">
                Toggle Dark/Light Mode
            </button>
        </div>

        <div class="button-container">

            <a href="dino.html" class="btn btn-primary page-button">
                🦖 Dino Game
            </a>

            <a href="price-compare.html" class="btn btn-success page-button">
                💲 Price Calculator
            </a>

            <a href="carb-counter.html" class="btn btn-warning page-button">
                🍝 Carb Counter
            </a>

            <!-- Add more buttons here -->
            <!--
            <a href="new-page.html" class="btn btn-info page-button">
                🚀 New Project
            </a>
            -->

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
