<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Designer</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#15171a;--muted:#6b7078;--border:#dfe2e6;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.panel,.preview{background:var(--panel);border:1px solid var(--border);border-radius:14px}.panel{padding:18px}.section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border)}.section:last-child{border:0;margin:0;padding:0}h2{font-size:14px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field:last-child{margin-bottom:0}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}input[type=text],input[type=password],input[type=email],textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:#fff;color:var(--text);font:inherit}textarea{min-height:84px;resize:vertical}.inline{display:flex;gap:8px;align-items:center}.inline input[type=color]{width:42px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;background:#fff}.inline input[type=range]{flex:1}.value{width:48px;text-align:right;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab,button{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;font-size:13px}.tab.active,button.primary{background:#111827;color:white;border-color:#111827}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:7px;font-size:12px}.check input{accent-color:var(--accent)}
.preview{min-height:700px;display:flex;flex-direction:column;padding:18px}.previewbox{flex:1;display:grid;place-items:center;border:1px dashed var(--border);border-radius:12px;background:repeating-conic-gradient(#fafafa 0 25%,#f1f1f1 0 50%) 50%/20px 20px;overflow:auto;padding:30px}.qrwrap{position:relative;line-height:0;box-shadow:0 10px 35px rgba(0,0,0,.08)}#qrCanvas{display:block;max-width:100%;height:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:120px}.status{font-size:12px;color:var(--muted);margin-top:9px;min-height:18px}.logo-preview{max-width:60px;max-height:60px;border:1px solid var(--border);border-radius:8px;padding:3px;object-fit:contain}.hidden{display:none!important}.preset{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.preset button{padding:7px 4px;font-size:11px}.danger{color:#b91c1c}.help{font-size:11px;color:var(--muted);line-height:1.4;margin-top:6px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.preview{min-height:520px}.top{align-items:start}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>QR Code Designer</h1><p>Create highly customizable QR codes entirely in your browser.</p></div></div>
  <div class="grid">
    <div class="panel">
      <div class="section">
        <h2>Content</h2>
        <div class="tabs" id="typeTabs">
          <button class="tab active" data-type="url">URL / Text</button><button class="tab" data-type="wifi">Wi-Fi</button><button class="tab" data-type="email">Email</button><button class="tab" data-type="phone">Phone</button><button class="tab" data-type="sms">SMS</button><button class="tab" data-type="vcard">Contact</button>
        </div>
        <div id="contentFields" style="margin-top:12px"></div>
      </div>
      <div class="section">
        <h2>Presets</h2><div class="preset"><button data-preset="classic">Classic</button><button data-preset="rounded">Rounded</button><button data-preset="dots">Dots</button><button data-preset="modern">Modern</button></div>
      </div>
      <div class="section">
        <h2>QR style</h2>
        <div class="row">
          <div class="field"><label>Module shape</label><select id="moduleShape"><option value="square">Square</option><option value="rounded">Rounded</option><option value="dots">Dots</option><option value="extra">Extra rounded</option><option value="diamond">Diamond</option></select></div>
          <div class="field"><label>Eye style</label><select id="eyeStyle"><option value="square">Square</option><option value="rounded">Rounded</option><option value="circle">Circle</option><option value="soft">Soft rounded</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label>Body color</label><div class="inline"><input id="bodyColor" type="color" value="#111111"><input id="bodyColorText" type="text" value="#111111"></div></div>
          <div class="field"><label class="check"><input id="bodyGradient" type="checkbox"> Use gradient</label><div id="gradientOptions" class="hidden" style="margin-top:8px"><div class="inline"><input id="bodyGradientEnd" type="color" value="#6366f1"><select id="bodyGradientDirection"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="diagonal">Diagonal</option><option value="reverse">Diagonal reverse</option></select></div></div></div>
          <div class="field"><label>Eye color</label><div class="inline"><input id="eyeColor" type="color" value="#111111"><input id="eyeColorText" type="text" value="#111111"></div></div>
        </div>
        <div class="row">
          <div class="field"><label>Background</label><div class="inline"><input id="bgColor" type="color" value="#ffffff"><input id="bgColorText" type="text" value="#ffffff"></div><label class="check" style="margin-top:8px"><input id="transparentBg" type="checkbox"> Transparent background</label></div>
          <div class="field"><label>Eye center color</label><div class="inline"><input id="eyeCenterColor" type="color" value="#111111"><input id="eyeCenterColorText" type="text" value="#111111"></div></div>
        </div>
        <div class="field"><label>Module spacing</label><div class="inline"><input id="spacing" type="range" min="0" max="0.28" step="0.01" value="0"><span class="value" id="spacingVal">0%</span></div></div>
        <div class="field"><label>Quiet zone</label><div class="inline"><input id="quiet" type="range" min="0" max="8" step="1" value="4"><span class="value" id="quietVal">4</span></div></div>
      </div>
      <div class="section">
        <h2>QR reliability</h2>
        <div class="row">
          <div class="field"><label>Error correction</label><select id="ecc"><option value="L">L — 7%</option><option value="M" selected>M — 15%</option><option value="Q">Q — 25%</option><option value="H">H — 30%</option></select></div>
          <div class="field"><label>Output size</label><div class="inline"><input id="size" type="range" min="256" max="1600" step="32" value="640"><span class="value" id="sizeVal">640px</span></div></div>
        </div>
        <div class="help">Highly stylized modules and large logos can reduce scan reliability. Error correction H is recommended when using a logo.</div>
      </div>
      <div class="section">
        <h2>Logo</h2>
        <div class="field"><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div>
        <div class="inline" id="logoInfo" style="display:none"><img id="logoThumb" class="logo-preview"><button id="removeLogo">Remove</button></div>
        <div id="logoOptions" class="hidden" style="margin-top:10px">
          <div class="field"><label>Logo size</label><div class="inline"><input id="logoSize" type="range" min="8" max="30" value="18"><span class="value" id="logoSizeVal">18%</span></div></div>
          <div class="field"><label>Logo padding</label><div class="inline"><input id="logoPad" type="range" min="0" max="25" value="8"><span class="value" id="logoPadVal">8%</span></div></div>
          <div class="row"><div class="field"><label>Logo background</label><select id="logoBg"><option value="white">White</option><option value="transparent">Transparent</option><option value="custom">Custom</option></select></div><div class="field"><label>Logo corners</label><select id="logoCorners"><option value="round">Rounded</option><option value="square">Square</option></select></div></div>
          <div class="field hidden" id="logoBgCustom"><label>Custom background</label><input id="logoBgColor" type="color" value="#ffffff"></div>
        </div>
      </div>
    </div>
    <div class="preview">
      <div class="previewbox"><div class="qrwrap"><canvas id="qrCanvas"></canvas></div></div>
      <div class="actions"><button class="primary" id="downloadPng">Download PNG</button><button id="downloadSvg">Download SVG</button><button id="copyPng">Copy PNG</button></div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>
<script>
/* Embedded QR generator library: qrcode-generator by Kazuhiko Arase, MIT licensed. */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

document.querySelectorAll('#typeTabs .tab').forEach(b=>b.onclick=()=>{contentType=b.dataset.type;document.querySelectorAll('#typeTabs .tab').forEach(x=>x.classList.toggle('active',x===b));$('contentFields').innerHTML=fields[contentType];bindContent();render()});
function bindContent(){document.querySelectorAll('#contentFields input,#contentFields textarea,#contentFields select').forEach(e=>e.addEventListener('input',render))}bindContent();
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function payload(){const g=id=>($(id)?.value||'').trim();switch(contentType){case'url':return g('f_text');case'wifi':return `WIFI:T:${g('f_sec')};S:${g('f_ssid')};P:${g('f_pass')};H:${$('f_hidden')?.checked?'true':'false'};;`;case'email':return `mailto:${g('f_email')}?subject=${encodeURIComponent(g('f_subject'))}&body=${encodeURIComponent(g('f_message'))}`;case'phone':return `tel:${g('f_phone')}`;case'sms':return `SMSTO:${g('f_smsphone')}:${g('f_smsmsg')}`;case'vcard':return `BEGIN:VCARD
VERSION:3.0
N:${g('f_last')};${g('f_first')};;;
FN:${g('f_first')} ${g('f_last')}
TEL:${g('f_vphone')}
EMAIL:${g('f_vemail')}
ORG:${g('f_org')}
URL:${g('f_url')}
END:VCARD`}}
function isEye(r,c,n){return (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7)}
function drawShape(ctx,x,y,w,h,shape){if(shape==='square'){ctx.fillRect(x,y,w,h);return}if(shape==='dots'||shape==='circle'){ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.min(w,h)/2,0,Math.PI*2);ctx.fill();return}if(shape==='diamond'){ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w,y+h/2);ctx.lineTo(x+w/2,y+h);ctx.lineTo(x,y+h/2);ctx.closePath();ctx.fill();return}const r=Math.min(w,h)*(shape==='extra'?.48:.25);ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function bodyFill(ctx,S){if(!state.bodyGradient)return state.bodyColor;let g;if(state.bodyGradientDirection==='vertical')g=ctx.createLinearGradient(0,0,0,S);else if(state.bodyGradientDirection==='diagonal')g=ctx.createLinearGradient(0,0,S,S);else if(state.bodyGradientDirection==='reverse')g=ctx.createLinearGradient(S,0,0,S);else g=ctx.createLinearGradient(0,0,S,0);g.addColorStop(0,state.bodyColor);g.addColorStop(1,state.bodyGradientEnd);return g}
function drawEye(ctx,x,y,unit,style,frameColor,centerColor){const outer=7*unit;ctx.fillStyle=frameColor;if(style==='circle'){ctx.beginPath();ctx.arc(x+3.5*unit,y+3.5*unit,3.5*unit,0,Math.PI*2);ctx.fill()}else{const r=style==='rounded'?1.7*unit:style==='soft'?2.5*unit:0;ctx.beginPath();ctx.roundRect(x,y,outer,outer,r);ctx.fill()}ctx.fillStyle=state.bgColor;if(style==='circle'){ctx.beginPath();ctx.arc(x+3.5*unit,y+3.5*unit,2.0*unit,0,Math.PI*2);ctx.fill()}else{const r=style==='rounded'?1.1*unit:style==='soft'?1.6*unit:0;ctx.beginPath();ctx.roundRect(x+unit,y+unit,5*unit,5*unit,r);ctx.fill()}ctx.fillStyle=centerColor;if(style==='circle'){ctx.beginPath();ctx.arc(x+3.5*unit,y+3.5*unit,1.5*unit,0,Math.PI*2);ctx.fill()}else{const r=style==='rounded'?1*unit:style==='soft'?1.4*unit:0;ctx.beginPath();ctx.roundRect(x+2*unit,y+2*unit,3*unit,3*unit,r);ctx.fill()}}
function render(){try{const qr=qrcode(0,state.ecc);qr.addData(payload()||' ');qr.make();const n=qr.getModuleCount(), quiet=state.quiet, total=n+quiet*2, S=state.size, unit=S/total;const c=$('qrCanvas');c.width=S;c.height=S;const ctx=c.getContext('2d');ctx.clearRect(0,0,S,S);if(!state.transparentBg){ctx.fillStyle=state.bgColor;ctx.fillRect(0,0,S,S);}const gap=state.spacing*unit;for(let r=0;r<n;r++)for(let col=0;col<n;col++){if(!qr.isDark(r,col))continue;if(isEye(r,col,n))continue;if(moduleInLogoClearArea(r,col,unit,quiet,S))continue;const x=(col+quiet)*unit+gap/2,y=(r+quiet)*unit+gap/2,w=unit-gap;ctx.fillStyle=bodyFill(ctx,S);drawShape(ctx,x,y,w,w,state.moduleShape)}drawEye(ctx,quiet*unit,quiet*unit,unit,state.eyeStyle,state.eyeColor,state.eyeCenterColor);drawEye(ctx,(quiet+n-7)*unit,quiet*unit,unit,state.eyeStyle,state.eyeColor,state.eyeCenterColor);drawEye(ctx,quiet*unit,(quiet+n-7)*unit,unit,state.eyeStyle,state.eyeColor,state.eyeCenterColor);if(logo)drawLogo(ctx,S,unit,quiet,n);$('status').textContent=`Version ${Math.round((n-17)/4)} · ${n}×${n} modules · ${state.ecc} error correction`;window.lastQr={qr,n,quiet,unit};}catch(e){$('status').textContent='Content is too long for this QR configuration.'}}
function logoClearArea(S){if(!logo)return null;const box=S*(state.logoSize/100),pad=box*(state.logoPad/100),x=(S-box)/2,y=(S-box)/2;return{x:x-pad,y:y-pad,w:box+pad*2,h:box+pad*2}}
function moduleInLogoClearArea(row,col,unit,quiet,S){const a=logoClearArea(S);if(!a)return false;const x=(col+quiet)*unit,y=(row+quiet)*unit;return x+unit>a.x&&x<a.x+a.w&&y+unit>a.y&&y<a.y+a.h}
function drawLogo(ctx,S,unit,quiet,n){const pct=state.logoSize/100, box=S*pct, pad=box*state.logoPad/100, x=(S-box)/2,y=(S-box)/2;ctx.save();ctx.fillStyle=state.logoBg==='custom'?$('logoBgColor').value:state.logoBg==='white'?'#fff':'rgba(255,255,255,0)';if(state.logoBg!=='transparent'){if(state.logoCorners==='round'){ctx.beginPath();ctx.roundRect(x-pad,y-pad,box+pad*2,box+pad*2,Math.min(box*.16,pad+5));ctx.fill()}else ctx.fillRect(x-pad,y-pad,box+pad*2,box+pad*2)}ctx.beginPath();if(state.logoCorners==='round')ctx.roundRect(x,y,box,box,box*.14);else ctx.rect(x,y,box,box);ctx.clip();ctx.drawImage(logo,x,y,box,box);ctx.restore()}
$('bodyGradient').onchange=e=>{state.bodyGradient=e.target.checked;$('gradientOptions').classList.toggle('hidden',!e.target.checked);render()};$('bodyGradientEnd').oninput=e=>{state.bodyGradientEnd=e.target.value;render()};$('bodyGradientDirection').onchange=e=>{state.bodyGradientDirection=e.target.value;render()};$('transparentBg').onchange=e=>{state.transparentBg=e.target.checked;render()};
function syncColor(id){const c=$(id),t=$(id+'Text');c.addEventListener('input',()=>{t.value=c.value;state[id]=c.value;render()});t.addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test(t.value)){c.value=t.value;state[id]=t.value;render()}})}['bodyColor','eyeColor','bgColor','eyeCenterColor'].forEach(syncColor);
[['moduleShape','moduleShape'],['eyeStyle','eyeStyle'],['ecc','ecc']].forEach(([id,k])=>$(id).addEventListener('change',e=>{state[k]=e.target.value;render()}));
function slider(id,key,suffix){$(id).addEventListener('input',e=>{state[key]=+e.target.value;$(id+'Val').textContent=e.target.value+suffix;render()})}slider('spacing','spacing','%');$('spacing').addEventListener('input',()=>{$('spacingVal').textContent=Math.round(state.spacing*100)+'%'});slider('quiet','quiet','');slider('size','size','px');slider('logoSize','logoSize','%');slider('logoPad','logoPad','%');
$('logoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{logo=img;$('logoInfo').style.display='flex';$('logoOptions').classList.remove('hidden');$('logoThumb').src=img.src;state.ecc='H';$('ecc').value='H';render()};img.src=URL.createObjectURL(f)});$('removeLogo').onclick=()=>{logo=null;$('logoFile').value='';$('logoInfo').style.display='none';$('logoOptions').classList.add('hidden');render()};
$('logoBg').onchange=e=>{state.logoBg=e.target.value;$('logoBgCustom').classList.toggle('hidden',e.target.value!=='custom');render()};$('logoCorners').onchange=e=>{state.logoCorners=e.target.value;render()};$('logoBgColor').oninput=render;
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=b.dataset.preset;const vals={classic:{moduleShape:'square',eyeStyle:'square',bodyColor:'#111111',eyeColor:'#111111',eyeCenterColor:'#111111',spacing:0},rounded:{moduleShape:'rounded',eyeStyle:'rounded',bodyColor:'#183b66',eyeColor:'#183b66',eyeCenterColor:'#183b66',spacing:.04},dots:{moduleShape:'dots',eyeStyle:'circle',bodyColor:'#6d28d9',eyeColor:'#6d28d9',eyeCenterColor:'#6d28d9',spacing:.16},modern:{moduleShape:'extra',eyeStyle:'soft',bodyColor:'#0f766e',eyeColor:'#0f766e',eyeCenterColor:'#0f766e',spacing:.06}}[p];Object.assign(state,vals);for(const k of ['moduleShape','eyeStyle','bodyColor','eyeColor','eyeCenterColor','spacing']){const el=$(k);if(el)el.value=state[k];if($(k+'Text'))$(k+'Text').value=state[k]}$('spacing').value=state.spacing;$('spacingVal').textContent=Math.round(state.spacing*100)+'%';render()});
function svgString(){if(!window.lastQr)return '';const {qr,n,quiet,unit}=window.lastQr,S=state.size,total=n+quiet*2;let defs='';if(state.bodyGradient){let x1='0%',y1='0%',x2='100%',y2='0%';if(state.bodyGradientDirection==='vertical'){x2='0%';y2='100%'}else if(state.bodyGradientDirection==='diagonal'){x2='100%';y2='100%'}else if(state.bodyGradientDirection==='reverse'){x1='100%';x2='0%';y2='100%'}defs=`<defs><linearGradient id="qrBodyGradient" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><stop offset="0%" stop-color="${state.bodyColor}"/><stop offset="100%" stop-color="${state.bodyGradientEnd}"/></linearGradient></defs>`}let out=`<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${defs}${state.transparentBg?'':`<rect width="100%" height="100%" fill="${state.bgColor}"/>`}`;function shape(x,y,w,h,color,shape){let r=shape==='extra'?w*.48:shape==='rounded'?w*.25:0;if(shape==='dots'||shape==='circle')return `<circle cx="${x+w/2}" cy="${y+h/2}" r="${w/2}" fill="${color}"/>`;if(shape==='diamond')return `<path d="M ${x+w/2} ${y} L ${x+w} ${y+h/2} L ${x+w/2} ${y+h} L ${x} ${y+h/2} Z" fill="${color}"/>`;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${color}"/>`}const body=state.bodyGradient?'url(#qrBodyGradient)':state.bodyColor;const gap=state.spacing*unit;for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c)&&!isEye(r,c,n)&&!moduleInLogoClearArea(r,c,unit,quiet,S))out+=shape((c+quiet)*unit+gap/2,(r+quiet)*unit+gap/2,unit-gap,unit-gap,body,state.moduleShape);function eye(x,y){out+=shape(x,y,7*unit,7*unit,state.eyeColor,state.eyeStyle==='circle'?'circle':state.eyeStyle);if(!state.transparentBg)out+=`<rect x="${x+unit}" y="${y+unit}" width="${5*unit}" height="${5*unit}" rx="${state.eyeStyle==='rounded'?unit:0}" fill="${state.bgColor}"/>`;out+=shape(x+2*unit,y+2*unit,3*unit,3*unit,state.eyeCenterColor,state.eyeStyle==='circle'?'circle':state.eyeStyle)}eye(quiet*unit,quiet*unit);eye((quiet+n-7)*unit,quiet*unit);eye(quiet*unit,(quiet+n-7)*unit);if(logo){const pct=state.logoSize/100,box=S*pct,pad=box*state.logoPad/100,x=(S-box)/2,y=(S-box)/2;if(state.logoBg!=='transparent')out+=`<rect x="${x-pad}" y="${y-pad}" width="${box+pad*2}" height="${box+pad*2}" rx="${state.logoCorners==='round'?Math.min(box*.16,pad+5):0}" fill="${state.logoBg==='custom'?$('logoBgColor').value:'#fff'}"/>`;const tmp=document.createElement('canvas');tmp.width=tmp.height=box;tmp.getContext('2d').drawImage(logo,0,0,box,box);out+=`<image href="${tmp.toDataURL('image/png')}" x="${x}" y="${y}" width="${box}" height="${box}" preserveAspectRatio="xMidYMid slice"/>`}return out+'</svg>'}
$('downloadPng').onclick=()=>{const a=document.createElement('a');a.href=$('qrCanvas').toDataURL('image/png');a.download='qr-code.png';a.click()};$('downloadSvg').onclick=()=>{const blob=new Blob([svgString()],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qr-code.svg';a.click()};$('copyPng').onclick=async()=>{try{const blob=await new Promise(r=>$('qrCanvas').toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);$('status').textContent='PNG copied to clipboard.'}catch(e){$('status').textContent='Clipboard image copy is not supported by this browser.'}};
render();
