<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakPotato</title>
    <link rel="icon" type="image/x-icon" href="/potato.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        // ---- Page registry ----
        // Every page on the site lives here once. Categories below just
        // reference these by id, and the Featured picker pulls from the
        // same list so you never have to type a page in twice.
        const PAGES = {
            "word-game":     { title: "Word Game",      emoji: "✏️", href: "word-game.html",     variant: "success" },
            "ai":            { title: "A.I. Chat",      emoji: "🤖", href: "ai.html",             variant: "primary" },
            "taps":          { title: "Simple Tapping Game", emoji: "🔴", href: "taps.html",      variant: "warning" },
            "fish":          { title: "Fish",           emoji: "🐟", href: "fish.html",           variant: "primary" },
            "ball":          { title: "Balls",          emoji: "🔴", href: "ball.html",           variant: "success" },
            "dino":          { title: "Dino Game",      emoji: "🦖", href: "dino.html",           variant: "primary" },
            "weather":       { title: "Weather",        emoji: "☁️", href: "weather-v2.html",     variant: "primary" },
            "clock":         { title: "Clock",          emoji: "🕙", href: "clock.html",          variant: "warning" },
            "price-compare": { title: "Price Calculator", emoji: "💲", href: "price-compare.html", variant: "success" },
            "carb-counter":  { title: "Carb Counter",   emoji: "🍝", href: "carb-counter.html",   variant: "warning" },
            "solitaire":     { title: "Solitaire",       emoji: "♣️", href: "klondike-solitaire.html", variant: "success"},
            "greg":          { title: "Greg the Rock",   emoji: "🪨", href: "greg.html",           variant: "warning"},
            "qr-code":       { title: "QR Code Maker",   emoji: "⬛", href: "qr-code-v2.html",     variant: "warning"},
            "decode":        { title: "Decoder",          emoji: "⌨️", href: "decode.html",     variant: "success"},
            "json":          { title: "JSON Formatter",   emoji: "⌨️", href: "json-formatter.html",     variant: "primary"}, 
            "air-direct":    { title: "AirDirect",        emoji: "☁️", href: "air-direct.html",     variant: "primary"},
            "color-flood":   { title: "Color Flood",     emoji: "🎨", href: "color-flood.html",     variant: "warning"},
            "flies":         { title: "Flies-R-Us",     emoji: "🪰", href: "flies-r-us.html",     variant: "primary"},
            "blackjack":     { title: "Blackjack",      emoji: "♦️", href: "blackjack.html",     variant: "success"},
            "bog":           { title: "Bog Bodies",      emoji: "👀", href: "bog-bodies.html",      variant: "success"},
            "get-ghost":     { title: "Get A Ghost",   emoji: "👻", href: "get-a-ghost.html",       variant: "warning"},

        };

        // Which pages show up under each category, in order.
        // "wip" and "advertisements" start empty — just add page ids here
        // (after adding the page itself to PAGES above) whenever you're
        // ready to list something under them.
        const CATEGORIES = {
            games:   ["word-game", "ai", "solitaire", "taps", "fish", "ball", "color-flood", "dino"],
            utility: ["weather", "clock", "price-compare", "carb-counter", "json", "decode"],
            wip:     ["blackjack"],
            advertisements: ["bog", "flies", "get-ghost", "air-direct", "greg"],
        };

        function pageButton(id) {
            const p = PAGES[id];
            const a = document.createElement("a");
            a.href = p.href;
            a.className = `btn btn-${p.variant} page-button`;
            a.innerHTML = `${p.emoji} ${p.title}`;
            return a;
        }

        function buildCategory(id) {
            const body = document.getElementById(`cat-body-${id}`);
            body.innerHTML = "";
            CATEGORIES[id].forEach(pageId => body.appendChild(pageButton(pageId)));
        }

        // ---- Featured category ----
        // Edit this list by hand to control what's featured. Two ways to
        // pull an entry without deleting it:
        //   1. Comment the line out
        //   2. Set hidden: true on it
        // You can list more than one — all non-hidden entries show up.
        const FEATURED = [
            { id: "solitaire" },
            // { id: "word-game" },              // uncomment to feature
            // { id: "carb-counter", hidden: true }, // set hidden: false to bring back
        ];

        function renderFeatured() {
            const wrapper = document.getElementById("featured-category-wrapper");
            const body = document.getElementById("cat-body-featured");

            const active = FEATURED.filter(f => !f.hidden && PAGES[f.id]);

            // No active featured pages? Hide the whole category.
            wrapper.style.display = active.length ? "" : "none";

            body.innerHTML = "";
            active.forEach(f => body.appendChild(pageButton(f.id)));
        }

        document.addEventListener("DOMContentLoaded", function () {
            const themeToggleBtn = document.getElementById("theme-toggle");
            const body = document.body;
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme === "dark") {
                body.classList.add("bg-dark", "text-light");
            }

            themeToggleBtn.addEventListener("click", function () {
                body.classList.toggle("bg-dark");
                body.classList.toggle("text-light");

                if (body.classList.contains("bg-dark")) {
                    localStorage.setItem("theme", "dark");
                } else {
                    localStorage.setItem("theme", "light");
                }
            });

            // Build the static categories
            buildCategory("games");
            buildCategory("utility");
            buildCategory("wip");
            buildCategory("advertisements");

            // Build the Featured category from the FEATURED config above
            renderFeatured();

            // List of fake sponsored pages
            const fakeAds = [
                "flies-r-us.html",
                "bog-bodies.html"
            ];

            // Randomly open one of the fake ads
            document.getElementById("sponsored-ad").addEventListener("click", function () {
                const randomAd = fakeAds[Math.floor(Math.random() * fakeAds.length)];
                window.location.href = randomAd;
            });
        });
    </script>

    <style>
        .page-button {
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 20px;
            font-size: 1.2rem;
            display: block;
        }

        .category-card {
            margin-bottom: 16px;
        }

        .category-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .category-header .chevron {
            transition: transform 0.2s;
        }

        .category-header[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        .category-body {
            padding: 10px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Dark mode: Bootstrap cards default to a white background
           regardless of the body's bg-dark class, so override them here. */
        body.bg-dark .card {
            background-color: #2b3035;
            border-color: #495057;
        }

        body.bg-dark .category-header,
        body.bg-dark .category-body {
            color: #f8f9fa;
        }

        /* Sponsored Ad */
        .sponsored-ad {
            max-width: 600px;
            margin: 40px auto 20px;
            padding: 20px;
            border: 2px dashed #999;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .sponsored-ad:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .sponsored-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .sponsored-ad h3 {
            margin-bottom: 8px;
        }

        .sponsored-ad p {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>JakPotato</h1>

            <button id="theme-toggle" class="btn btn-outline-secondary">
                Toggle Dark/Light Mode
            </button>
        </div>

        <!-- Featured category -->
        <div id="featured-category-wrapper" class="card category-card">
            <div class="category-header" role="button" data-bs-toggle="collapse" data-bs-target="#collapse-featured" aria-expanded="true" aria-controls="collapse-featured">
                <span>⭐ Featured</span>
                <span class="chevron">▾</span>
            </div>
            <div id="collapse-featured" class="collapse show">
                <div id="cat-body-featured" class="category-body"></div>
            </div>
        </div>

        <!-- Games category -->
        <div class="card category-card">
            <div class="category-header" role="button" data-bs-toggle="collapse" data-bs-target="#collapse-games" aria-expanded="true" aria-controls="collapse-games">
                <span>🎮 Games</span>
                <span class="chevron">▾</span>
            </div>
            <div id="collapse-games" class="collapse show">
                <div id="cat-body-games" class="category-body"></div>
            </div>
        </div>

        <!-- Utility category -->
        <div class="card category-card">
            <div class="category-header" role="button" data-bs-toggle="collapse" data-bs-target="#collapse-utility" aria-expanded="true" aria-controls="collapse-utility">
                <span>🛠️ Utility</span>
                <span class="chevron">▾</span>
            </div>
            <div id="collapse-utility" class="collapse show">
                <div id="cat-body-utility" class="category-body"></div>
            </div>
        </div>

        <!-- Work in Progress category -->
        <div class="card category-card">
            <div class="category-header" role="button" data-bs-toggle="collapse" data-bs-target="#collapse-wip" aria-expanded="true" aria-controls="collapse-wip">
                <span>🚧 Work in Progress</span>
                <span class="chevron">▾</span>
            </div>
            <div id="collapse-wip" class="collapse show">
                <div id="cat-body-wip" class="category-body"></div>
            </div>
        </div>

        <!-- Advertisements category -->
        <div class="card category-card">
            <div class="category-header" role="button" data-bs-toggle="collapse" data-bs-target="#collapse-advertisements" aria-expanded="true" aria-controls="collapse-advertisements">
                <span>📢 Advertisements</span>
                <span class="chevron">▾</span>
            </div>
            <div id="collapse-advertisements" class="collapse show">
                <div id="cat-body-advertisements" class="category-body"></div>
            </div>
        </div>

        <!-- Sponsored Section (always visible, not collapsible) -->
        <div id="sponsored-ad" class="sponsored-ad">

            <div class="sponsored-label">
                Sponsored
            </div>

            <h3>✨ You Might Also Like...</h3>

            <p>
                Discover something completely legitimate™
            </p>

            <small>
                Click to learn more
            </small>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
